{% extends 'base.html' %}

{% block contenido %}
<center>
    <div class="container-fluid" style="margin: 30px;">
        <a id="boton_post" 
           href="{% url 'noticias:crear_categoria' %}?next={% url 'noticias:modificar_noticia' pk=object.id %}">
            Crear nueva categoría
        </a>
        <br>
        <h1>Modificar Noticia</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" value="Guardar cambios">
        </form>
    </div>
</center>
{% endblock %}
